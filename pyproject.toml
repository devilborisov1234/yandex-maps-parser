[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymcontacts"
version = "1.0.0"
description = "Сбор организаций и контактов из Яндекс Карт (Борисов и другие города)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "phonenumbers>=8.13",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright==1.58.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ymcontacts = "ymcontacts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Настройки линтера ruff: простые правила, читаемый код
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 игнорируем: в pydantic-конфиге это нормальная практика
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]